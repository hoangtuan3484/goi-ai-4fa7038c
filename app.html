*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:700px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
h1{font-size:26px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.02em}
.lede{margin:6px 0 0;color:var(--text2);font-size:15px}
.updated{margin:0 0 12px;font-size:14px;color:var(--text2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sched{font-size:13px;color:var(--text3);margin-top:2px}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}

.tag.red{background:var(--red-bg);color:var(--red-fg)}
.tag.neutral{background:var(--chip-bg);color:var(--text2)}
.attention{margin-top:16px;border-radius:12px;background:var(--red-bg);color:var(--red-fg);padding:12px 14px;font-size:15px}
.attention b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px}
.summary{margin-top:16px;padding:16px}
.k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.muted{color:var(--text2);font-size:14px}
.faint{color:var(--text3);font-size:13px}
.sgrid{display:grid;grid-template-columns:1fr;gap:0;margin-top:14px;border-top:1px solid var(--border)}
.sgrid>div{padding:12px 0;border-bottom:1px solid var(--border)}
.sgrid>div:last-child{border-bottom:0;padding-bottom:0}
@media (min-width:520px){.sgrid{grid-template-columns:1fr 1fr}.sgrid>div{border-bottom:0}.sgrid>div:first-child{border-right:1px solid var(--border);padding-right:14px}.sgrid>div:nth-child(2){padding-left:14px}.sgrid>div:last-child{grid-column:1/-1;border-top:1px solid var(--border);padding-top:12px}}
.mid{font-size:18px;font-weight:650;margin-top:2px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h2{font-size:19px;margin:28px 0 2px;font-weight:700}
.cap{margin:0 0 10px;font-size:14px;color:var(--text2)}
.list{overflow:hidden}
.item+.item{border-top:1px solid var(--border)}
.row{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 14px;min-height:56px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.row:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;border-radius:12px}
.logo{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.logo.x{box-shadow:inset 0 0 0 1px var(--border)}
.logo svg{width:16px;height:16px;display:block}
.main{flex:1;min-width:0}
.l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.name{font-weight:600;font-size:16px;min-width:0}
.amt{font-weight:650;font-size:16px;text-align:right;white-space:nowrap}
.l2{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px;font-size:14px;color:var(--text2)}
.l2 .left{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chev{color:var(--text3);font-size:14px;margin-top:5px;transition:transform .15s;flex-shrink:0}
.item.open .chev{transform:rotate(90deg)}
.bar{height:4px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--fill)}
.det{display:none;padding:0 14px 14px 54px;font-size:14px;color:var(--text2)}
.item.open .det{display:block}
.det div{padding:2px 0}
.topup{margin-top:6px;padding:8px 10px;border:1px solid var(--border);border-radius:10px}
details.src{margin-top:28px}
details.src summary{cursor:pointer;font-size:16px;font-weight:650;min-height:44px;display:flex;align-items:center}
details.src ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--text2)}
details.src li{margin:4px 0}
.foot{margin-top:12px;font-size:13px;color:var(--text3)}
</style>

h+='<div class="card summary"><div class="updated">Updated '+fmtStamp(D.updatedAt)+(ageH>13?' <span class="tag amber">Stale</span>':'')+' <span class="faint">· refreshes '+esc(D.refreshSchedule)+'</span></div><div class="k">Monthly subscription cost</div><div class="big">'+vnd(monthly)+'</div><div class="muted">≈ $'+Math.round(monthly/fx)+' · '+subs.length+' plans · API credits not included</div><div class="sgrid">';
if(nextSub){const d=daysUntil(nextSub.renews);h+='<div><div class="k">Next renewal</div><div class="mid">'+esc(nextSub.name)+' '+chip(d,"sub")+'</div><div class="muted">'+fmtDate(nextSub.renews,true)+' · '+(nextSub.usd?usd(nextSub.usd)+' ≈ ':'')+vnd(nextSub.vnd)+'</div></div>';}
h+='<div><div class="k">API credit left</div><div class="mid">≈ '+vnd(creditTotal)+'</div><div class="muted">'+usd(usdLeft)+' + '+vnd(vndLeft)+(trial?' · incl. '+vnd(trial.left)+' Cloud trial':'')+'</div></div>';
if(nextCredit){const d=daysUntil(nextCredit.expires);h+='<div><div class="k">Next credit expiry</div><div class="mid">'+esc(nextCredit.name)+' '+chip(d,"credit")+'</div><div class="muted">'+money(nextCredit)+' · expires '+fmtDate(nextCredit.expires,true)+'</div></div>';}
h+='</div></div>';
h+='<h2>Subscriptions</h2><p class="cap">All paid with '+esc(D.card)+' · sorted by renewal · tap a row for details</p><div class="card list">';
subs.forEach(s=>{const d=daysUntil(s.renews);h+='<div class="item" data-id="'+s.id+'"><button class="row" aria-expanded="false">'+logo(s.logo)+'<div class="main"><div class="l1"><span class="name">'+esc(s.name)+'</span><span class="amt">'+(s.usd?usd(s.usd):vnd(s.vnd))+'</span></div><div class="l2"><span class="left">Renews '+fmtDate(s.renews,true)+' '+chip(d,"sub")+(s.payTag?' <span class="tag neutral">'+esc(s.payTag)+'</span>':'')+'</span><span>'+(s.usd?'≈ '+vnd(s.vnd)+'/mo':esc(s.priceNote))+'</span></div></div><span class="chev">›</span></button><div class="det">'+s.details.map(x=>'<div>'+esc(x)+'</div>').join("")+'</div></div>';});
h+='</div>';
h+='<h2>API credits</h2><p class="cap">Balances as of '+fmtStamp(D.updatedAt)+' · sorted by expiry · bars show remaining</p><div class="card list">';
credits.forEach(c=>{const d=daysUntil(c.expires);const pct=c.cap?Math.max(0,Math.min(100,c.left/c.cap*100)):null;h+='<div class="item" data-id="'+c.id+'"><button class="row" aria-expanded="false">'+logo(c.logo)+'<div class="main"><div class="l1"><span class="name">'+esc(c.name)+'</span><span class="amt">'+money(c)+'</span></div><div class="l2"><span class="left">Expires '+fmtDate(c.expires,true)+' '+chip(d,"credit")+'</span><span>'+(c.cap?'of '+(c.currency==="USD"?usd(c.cap):vnd(c.cap))+' · '+Math.round(pct)+'% left':esc(c.sub))+'</span></div>'+(pct!==null?'<div class="bar" aria-label="'+Math.round(pct)+'% remaining"><i style="width:'+pct.toFixed(2)+'%"></i></div>':'')+'</div><span class="chev">›</span></button><div class="det"><div>'+esc(c.sub)+'</div>'+c.details.map(x=>'<div>'+esc(x)+'</div>').join("")+'</div></div>';});
h+='</div>';
const left=Math.max(0,100-G.usedPct);
h+='<h2>Usage limits</h2><p class="cap">Checked '+esc(G.checked)+'</p><div class="card list"><div class="item" data-id="grokbot"><button class="row" aria-expanded="false">'+logo("grokbot")+'<div class="main"><div class="l1"><span class="name">Grok Bot · weekly limit</span><span class="amt">'+(+left.toFixed(1))+'% left</span></div><div class="l2"><span class="left">'+G.usedPct+'% used · '+esc(resetLine())+'</span></div><div class="bar" aria-label="'+left+'% remaining"><i style="width:'+left+'%;'+(resetMs<=0?'opacity:.4':'')+'"></i></div><div class="l2"><span class="left">Extra credit top-ups $70.00 · balance in app only</span></div></div><span class="chev">›</span></button><div class="det"><div>Weekly limit (Super plan) · '+esc(G.resetNote)+'</div>'+G.topUps.map(t=>'<div class="topup"><b>'+esc(t.usd)+' · '+esc(t.vnd)+'</b> · '+esc(t.date)+'<br>Ref '+esc(t.ref)+'<br><span class="faint">'+esc(t.source)+'</span></div>').join("")+G.notes.map(x=>'<div>'+esc(x)+'</div>').join("")+'</div></div></div>';
h+='<details class="src"><summary>Data sources ('+D.sources.length+')</summary><ul>'+D.sources.map(s=>'<li>'+esc(s)+'</li>').join("")+'</ul><div class="foot">1 USD ≈ '+fx.toLocaleString("en-US")+'₫ (indicative, '+esc(D.fx.asOf)+') · countdowns in ICT calendar days · amber ≤ 14 days · red ≤ 3 days</div></details>';
const app=document.getElementById("app");app.innerHTML=h;
app.querySelectorAll(".item").forEach(it=>{const b=it.querySelector(".row");b.addEventListener("click",()=>{const o=it.classList.toggle("open");b.setAttribute("aria-expanded",o?"true":"false");});});
})();
</script>
</body>
</html>

    return {
      fresh: fresh, live: live, stale: stale, missedCount: missed.length, attention: attention, tiles: [chargeTile, riskTile],
      credits: { total: "≈ " + fmtVnd(roundK(usableVnd)) + " usable", groups: groups, note: creditNote }, creditRows: credits, usableVnd: usableVnd, usableCount: usable.length,
      subs: { total: (usdSubs.length ? "≈ " : "") + fmtVnd(sum(subs, (s) => s.vnd)) + " / month", rows: subs, note: split + " per month" + (usdSubs.length ? " · " + fxText : "") },
      usage: usage, deadlines: deadlines, sources: sources, legend: legend,
    };
  }

  /* ---------- view: model -> markup (maps 1:1 to React components) ---------- */
  const chipView = (c) => html`<span class="chip ${c.tone}">${c.text}</span>`;
  const logoView = (key) => {
    const L = Object.prototype.hasOwnProperty.call(LOGO, key) ? LOGO[key] : null;
    return L
      ? html`<span class="logo" style="background:${L.bg}"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="${L.fg}" d="${L.d}"></path></svg></span>`
      : html`<span class="logo" style="background:#71717a">${String(key || "?").charAt(0).toUpperCase()}</span>`;
  };
  const detailsView = (pairs) => html`<dl class="kv">${pairs.filter((p) => p[1] && p[1].length).map((p) =>
    html`<div class="kv-row${p[0] === "Source" ? " foot" : ""}"><dt>${p[0]}</dt><dd>${Array.isArray(p[1]) ? p[1].map((t, i) => html`<span class="ln${i ? "" : " first"}">${t}</span>`) : p[1]}</dd></div>`)}</dl>`;
  const paceView = (p) => html`<div class="pace">
    <div class="pace-stats">
      <div><div class="cap">Needed per day</div><div class="num">${p.needed}</div></div>
      <div class="r"><div class="cap">Recent per day</div><div class="num">${p.recent}</div></div>
    </div>
    <div class="gauge ${p.tone}" role="img" aria-label="${p.label}"><i style="width:${p.pct}%"></i></div>
    <div class="verdict">${p.chip ? chipView(p.chip) : ""}<span>${p.text}</span></div>
  </div>`;
  const rowView = (r, ui, first) => {
    const open = !!ui.open[r.id];
    return html`<div class="item${first ? " first" : ""}${r.muted ? " muted" : ""}">
      <button class="row" data-toggle="${r.id}" aria-expanded="${open ? "true" : "false"}" aria-controls="d-${r.id}">
        ${logoView(r.logo)}
        <span class="main">
          <span class="l1"><span class="name">${r.name}</span><span class="amt">${r.amount}</span></span>
          <span class="l2"><span class="when"><span>${r.when}</span>${r.chips.map(chipView)}</span><span class="sec" data-live="${r.liveKey || ""}">${r.liveKey ? "" : r.secondary}</span></span>
          ${r.meter ? html`<span class="meter${r.meter.soft ? " soft" : ""}" role="img" aria-label="${r.meter.label}"><i style="width:${r.meter.pct}%"></i></span>` : ""}
          ${r.foot ? html`<span class="l3"><span>${r.foot[0]}</span><span class="sec">${r.foot[1]}</span></span>` : ""}
        </span>
        <span class="chev${open ? " open" : ""}" aria-hidden="true">›</span>
      </button>
      ${r.panel ? paceView(r.panel) : ""}
      <div class="details${open ? " open" : ""}" id="d-${r.id}">${detailsView(r.details)}</div>
    </div>`;
  };
  const cardView = (rows, ui) => html`<div class="card">${rows.map((r, i) => rowView(r, ui, i === 0))}</div>`;
  const creditsCard = (groups, ui) => {
    let n = 0;
    return html`<div class="card">${groups.map((g) => html`${g.showTitle ? html`<div class="group cap">${g.title}</div>` : ""}${g.rows.map((r) => rowView(r, ui, n++ === 0))}`)}</div>`;
  };
  const sectionView = (title, total, body, note) => html`<div class="sec-head"><h2>${title}</h2>${total ? html`<span class="sec-total">${total}</span>` : ""}</div>${body}${note ? html`<p class="note">${note}</p>` : ""}`;
  const checkBtn = (cls, net) => html`<button class="${cls}" data-action="check" aria-busy="${net.busy ? "true" : "false"}">${net.busy ? "Checking…" : "Check for updates"}</button>`;
  const statusView = (f, net) => html`${f.level === "stale"
    ? html`<div class="stale" role="status"><b>Data may be out of date</b>${f.updated} · <span class="nw" data-live="age"></span> · ${f.missed}<div class="stale-row">${checkBtn("btn", net)}</div></div>`
    : html`<div class="status"><span class="dot${f.level === "late" ? " late" : ""}" aria-hidden="true"></span><span>${f.updated} · <span class="nw" data-live="age"></span>${f.level === "ok" && f.next ? " · " + f.next : ""}</span></div>
      ${f.level === "late" ? html`<div class="status-2"><span role="status">${f.missed}</span>${checkBtn("link", net)}</div>` : ""}`}
    ${net.message ? html`<div class="net" role="status">${net.message}</div>` : ""}`;
  const tileView = (t) => html`<div class="tile ${t.tone}"><div class="cap">${t.cap}</div><div class="big">${t.big}${t.est ? html`<span class="est">${t.est}</span>` : ""}</div>${t.sub ? html`<div class="t-sub">${t.sub}</div>` : ""}</div>`;
  const pageView = (m, ui) => html`<h1>AI Subscription</h1>
    ${statusView(m.fresh, ui.net)}
    ${m.attention.length ? html`<div class="alert" role="alert"><div class="cap">Needs attention</div><ul>${m.attention.map((a) => html`<li>${a}</li>`)}</ul></div>` : ""}
    <div class="tiles">${m.tiles.map(tileView)}</div>
    ${sectionView("API credits", m.credits.total, creditsCard(m.credits.groups, ui), m.credits.note)}
    ${sectionView("Subscriptions", m.subs.total, cardView(m.subs.rows, ui), m.subs.note)}
    ${m.usage.length ? sectionView("Usage limits", "", cardView(m.usage, ui), "") : ""}
    ${m.deadlines.length ? sectionView("Other dates", "", cardView(m.deadlines, ui), "") : ""}
    <button class="more" data-toggle="__sources" aria-expanded="${ui.open.__sources ? "true" : "false"}" aria-controls="src"><span>Data sources &amp; legend</span><span class="chev${ui.open.__sources ? " open" : ""}" aria-hidden="true">›</span></button>
    <div class="src${ui.open.__sources ? " open" : ""}" id="src"><ul>${m.sources.map((s) => html`<li>${s}</li>`)}</ul><div class="legend">${m.legend.map((p) => html`<p>${p}</p>`)}</div></div>`;

  /* ---------- self-tests on a frozen fixture: open app.html#selftest ---------- */
  function runSelfTests() {
    const out = [], check = (name, ok) => out.push((ok ? "PASS " : "FAIL ") + name), at = (s) => Date.parse(s), clone = (x) => JSON.parse(JSON.stringify(x));
    const T = "2026-11-11T09:00:00+07:00";
    const FIX = {
      updatedAt: T, timezone: { offsetHours: 7, label: "ICT" }, refreshHours: [6, 9, 12, 15, 18],
      rules: { staleGraceMinutes: 45, renewalAlertDays: 3, creditUrgentDays: 7, creditWarnDays: 15, creditRiskDays: 30, hideCountdownAfterDays: 90, paceWindowDays: 7 },
      fx: { usdVnd: 25000, asOf: "fixture" }, card: { name: "Card" },
      creditClasses: { api: { title: "Usable", counted: true }, restricted: { title: "Restricted", counted: false } },
      subscriptions: [{ id: "s1", name: "Plan", logo: "x", plan: "p", renews: "2026-11-20", price: { currency: "USD", amount: 10 }, autoRenew: true, notes: [], source: "f" }],
      credits: [
        { id: "c1", name: "Credit", logo: "x", class: "api", label: "l", currency: "USD", left: 10, cap: 20, expires: "2026-11-15", checkedAt: T, notes: [], source: "f" },
        { id: "c2", name: "Trial", logo: "x", class: "restricted", label: "l", currency: "VND", left: 1000, cap: null, expires: "2026-11-12", checkedAt: T, notes: [], source: "f" },
      ],
      usageLimits: [{ id: "u1", name: "Limit", logo: "x", usedPct: 10, resetsAt: "2026-11-12T08:55:00+07:00", checkedAt: T, notes: [], source: "f" }],
    };
    const NOW = at("2026-11-11T10:00:00+07:00");
    const bad = (fn) => { const f = clone(FIX); fn(f); return validateData(f).length > 0; };
    const c1 = (fn, now) => { const f = clone(FIX); if (fn) fn(f.credits[0], f); return buildModel(f, now || NOW).creditRows.find((c) => c.id === "c1"); };
    const hist = (left) => (c) => { c.history = [{ at: "2026-11-09T09:00:00+07:00", left: left }]; };
    check("live DATA passes validation", validateData(window.DATA).length === 0);
    check("fixture passes validation", validateData(FIX).length === 0);
    check("rejects impossible date", bad((f) => (f.credits[0].expires = "2026-02-30")));
    check("rejects negative balance", bad((f) => (f.credits[0].left = -1)));
    check("rejects balance above cap", bad((f) => (f.credits[0].left = 30)));
    check("rejects duplicate ids", bad((f) => (f.credits[1].id = "c1")));
    check("rejects unordered thresholds", bad((f) => (f.rules.creditUrgentDays = 40)));
    check("rejects usage over 100%", bad((f) => (f.usageLimits[0].usedPct = 120)));
    check("rejects missing source text", bad((f) => delete f.subscriptions[0].source));
    check("rejects unknown credit class", bad((f) => (f.credits[0].class = "toString")));
    check("rejects history reading after the current one", bad((f) => (f.credits[0].history = [{ at: "2026-11-12T09:00:00+07:00", left: 12 }])));
    check("rejects deadline without a valid date", bad((f) => (f.deadlines = [{ id: "d1", name: "Key", date: "2026-13-01", source: "f" }])));
    check("pace and projected loss from history", (() => { const c = c1(hist(14)); return Math.abs(c.pace - 2) < 1e-9 && Math.abs(c.loss - 2) < 1e-9; })());
    check("readings older than the pace window are ignored", c1((c) => (c.history = [{ at: "2026-10-01T09:00:00+07:00", left: 20 }])).pace === null);
    check("a balance rise inside the window gives no pace", c1(hist(5)).pace === null);
    check("4 days out and behind pace is red", c1(hist(14)).tone === "red");
    check("4 days out but on pace drops to amber", c1(hist(16)).tone === "amber");
    check("20 days out without pace is outlined", c1((c) => (c.expires = "2026-12-01")).tone === "watch");
    check("20 days out and on pace is neutral", c1((c) => { c.expires = "2026-12-01"; hist(12)(c); }).tone === "none");
    check("risk tile shows the estimated leftover", (() => { const f = clone(FIX); hist(14)(f.credits[0]); return buildModel(f, NOW).tiles[1].big === "≈ $2"; })());
    check("risk tile counts the full balance when no pace is known", buildModel(FIX, NOW).tiles[1].big === "≈ $10");
    check("expires today counts as 0 days, not expired", (() => { const c = c1(null, at("2026-11-15T23:59:00+07:00")); return c.days === 0 && !c.expired; })());
    check("expired the next local day", c1(null, at("2026-11-16T00:01:00+07:00")).expired);
    check("expired credit with balance flagged and excluded", (() => { const m = buildModel(FIX, at("2026-11-16T10:00:00+07:00")); return m.usableCount === 0 && m.attention.some((a) => a.indexOf("expiry") >= 0); })());
    check("restricted credit never coloured or counted", (() => { const m = buildModel(FIX, NOW); return m.creditRows.find((c) => c.id === "c2").tone === "none" && m.usableVnd === 250000; })());
    check("not stale within grace (12:30)", !buildModel(FIX, at("2026-11-11T12:30:00+07:00")).stale);
    check("stale after grace (12:50)", buildModel(FIX, at("2026-11-11T12:50:00+07:00")).stale);
    check("counts every missed refresh", buildModel(FIX, at("2026-11-11T15:50:00+07:00")).missedCount === 2);
    check("next refresh shown", buildModel(FIX, NOW).fresh.next === "next 12:00");
    const eve = clone(FIX); eve.updatedAt = "2026-11-11T18:00:00+07:00";
    check("overnight gap not stale at 05:00", !buildModel(eve, at("2026-11-12T05:00:00+07:00")).stale);
    check("overnight stale at 06:50", buildModel(eve, at("2026-11-12T06:50:00+07:00")).stale);
    check("renewal 9 days out stays neutral", buildModel(FIX, NOW).subs.rows[0].tone === "none");
    check("renewal 3 days out turns red", buildModel(FIX, at("2026-11-17T10:00:00+07:00")).subs.rows[0].tone === "red");
    check("passed renewal flagged unconfirmed", buildModel(FIX, at("2026-11-21T10:00:00+07:00")).subs.rows[0].cd === "Renewal unconfirmed");
    check("usage reset passed shows awaiting refresh", buildModel(FIX, at("2026-11-12T09:00:00+07:00")).usage[0].resetPassed);
    check("page renders the fixture", toMarkup(pageView(buildModel(FIX, NOW), { open: {}, net: { busy: false, message: "" } })).indexOf("Credit at risk") > 0);
    return out;
  }

  /* ---------- controller: change-only render, live slots, last-good fallback ---------- */
  let data = window.DATA, lastMarkup = "";
  const ui = { open: {}, net: { busy: false, message: "" } };
  const GOOD_KEY = "ai-subscription:last-good";
  function lastGood() {
    try { const s = JSON.parse(localStorage.getItem(GOOD_KEY) || "null"); return s && !validateData(s).length ? s : null; } catch (e) { return null; }
  }
  function rememberGood(d) {
    try { const s = lastGood(); if (!s || Date.parse(d.updatedAt) >= Date.parse(s.updatedAt)) localStorage.setItem(GOOD_KEY, JSON.stringify(d)); } catch (e) { /* storage unavailable */ }
  }
  function render() {
    try { draw(); } catch (err) {
      lastMarkup = "";
      app.innerHTML = toMarkup(html`<h1>AI Subscription</h1><div class="error" role="alert">The page could not be drawn (${String(err && err.message)}).</div>`);
    }
  }
  function draw() {
    if (location.hash === "#selftest") {
      app.innerHTML = toMarkup(html`<h1>AI Subscription · self-test</h1><div class="selftest">${runSelfTests().join("\n")}</div>`);
      lastMarkup = "";
      return;
    }
    const errors = validateData(data), shown = errors.length ? lastGood() : data, model = shown ? buildModel(shown, Date.now()) : null;
    if (!errors.length) rememberGood(data);
    const notice = errors.length
      ? html`<div class="error" role="alert">The latest data block could not be read (${errors.slice(0, 4).join(", ")}). ${shown ? "Showing the last good data from this device instead." : "The last refresh needs fixing."}</div>`
      : "";
    const markup = toMarkup(model ? html`${notice}${pageView(model, ui)}` : html`<h1>AI Subscription</h1>${notice}`);
    const fillLive = () => {
      if (!model) return;
      app.querySelectorAll("[data-live]").forEach((el) => {
        const key = el.getAttribute("data-live");
        if (key && el.textContent !== (model.live[key] || "")) el.textContent = model.live[key] || "";
      });
    };
    if (markup === lastMarkup) { fillLive(); return; }
    const active = document.activeElement, ds = active && active.dataset ? active.dataset : {};
    const focusSel = ds.toggle ? '[data-toggle="' + ds.toggle + '"]' : ds.action ? '[data-action="' + ds.action + '"]' : "";
    app.innerHTML = markup;
    lastMarkup = markup;
    fillLive();
    if (focusSel) { const el = app.querySelector(focusSel); if (el) el.focus({ preventScroll: true }); }
  }
  app.addEventListener("click", (e) => {
    const t = e.target.closest("[data-toggle]");
    if (t) { const id = t.getAttribute("data-toggle"); ui.open[id] = !ui.open[id]; render(); return; }
    if (e.target.closest('[data-action="check"]')) checkForUpdate(true);
  });

  /* ---------- pick up newer data while open: re-read this app's own file, accept only a strictly newer snapshot ---------- */
  const FILE = new URL("app.html", location.href).href, MARK_A = "/* DATA:" + "START */", MARK_B = "/* DATA:" + "END */";
  let lastCheck = 0;
  async function checkForUpdate(manual) {
    if (ui.net.busy || location.protocol === "file:" || (!manual && Date.now() - lastCheck < 5 * 60000)) return;
    lastCheck = Date.now();
    ui.net.busy = true;
    if (manual) { ui.net.message = ""; render(); }
    try {
      const res = await fetch(FILE, { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text(), a = text.indexOf(MARK_A), b = text.indexOf(MARK_B);
      if (a < 0 || b < 0) throw new Error("markers");
      const next = JSON.parse(text.slice(a + MARK_A.length, b));
      if (validateData(next).length) throw new Error("invalid");
      const changed = validateData(data).length > 0 || Date.parse(next.updatedAt) > Date.parse(data.updatedAt);
      if (changed) data = next;
      const t = new Date();
      ui.net.message = manual || changed ? (changed ? "New data loaded" : "No newer data yet") + " · checked " + two(t.getHours()) + ":" + two(t.getMinutes()) : "";
    } catch (err) {
      ui.net.message = manual ? "Couldn’t check for newer data" : ui.net.message;
    }
    ui.net.busy = false;
    render();
  }
  const tick = () => { render(); checkForUpdate(false); };
  tick();
  setInterval(tick, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
  window.addEventListener("pageshow", tick);
  window.addEventListener("hashchange", () => { lastMarkup = ""; render(); });
})();
</script>
</body>
</html>

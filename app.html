    if (hours < 24) return hours + "h " + minutes % 60 + "m";
    return Math.floor(hours / 24) + "d " + hours % 24 + "h";
  }
  function countdown(days, d) {
    if (days < 0) return "Date passed";
    if (days === 0) return "Today";
    if (days === 1) return "Tomorrow";
    if (days > d.rules.hideCountdownAfterDays) return "";
    return "In " + days + " days";
  }
  function nextSlot(after, d) {
    const base = localOrdinal(after, d) * DAY - offsetMs(d);
    const hours = d.refreshHours.slice().sort((a, b) => a - b);
    for (const h of hours) {
      const slot = base + h * HOUR;
      if (slot > after) return slot;
    }
    return base + DAY + hours[0] * HOUR;
  }
  function missedSlots(updated, now, d) {
    const end = now - d.rules.staleGraceMinutes * MINUTE;
    if (end <= updated) return 0;
    return sum(d.refreshHours, hour => {
      const shift = offsetMs(d) - hour * HOUR;
      return Math.max(0,
        Math.ceil((end + shift) / DAY) -
        Math.floor((updated + shift) / DAY) - 1
      );
    });
  }
  function freshness(d, now) {
    const updated = Date.parse(d.updatedAt);
    const expected = nextSlot(updated, d);
    const missed = missedSlots(updated, now, d);
    const future = updated > now;
    return {
      updated, expected, next: nextSlot(now, d), missed, future,
      stale: missed > 0,
      due: !future && !missed && now >= expected,
      title: future ? "Check device clock" :
        missed ? "Refresh missed" : now >= expected ? "Refresh due" : "Snapshot current",
      tone: future || missed ? "warn" : "good"
    };
  }
  function recentPace(c, rules) {
    const checked = Date.parse(c.checkedAt);
    const all = c.history.concat([{ at: c.checkedAt, left: c.left }])
      .slice().sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
    const readings = all.filter(row =>
      Date.parse(row.at) >= checked - rules.paceWindowDays * DAY &&
      Date.parse(row.at) <= checked
    );
    const spanMs = readings.length > 1 ? checked - Date.parse(readings[0].at) : 0;
    const rose = readings.some((row, i) => i > 0 && row.left > readings[i - 1].left);
    let reason = "";
    if (readings.length < 2) reason = "More balance readings are needed.";
    else if (rose) reason = "The balance increased; spending cannot be isolated.";
    else if (spanMs < MIN_PACE_SPAN) reason = "The readings span less than 12 hours.";
    let rate = reason ? null : Math.max(0, (readings[0].left - c.left) / (spanMs / DAY));
    if (rate !== null && !finite(rate)) {
      rate = null;
      reason = "The rate exceeds the supported numeric range.";
    }
    return {
      rate, spanMs, spanDays: spanMs / DAY, reason, all, readings,
      lowConfidence: rate !== null && spanMs < LOW_CONFIDENCE_SPAN
    };
  }
  function flattenData(value, path = "DATA", out = []) {
    if (Array.isArray(value) && value.length) {
      value.forEach((item, i) => flattenData(item, path + "[" + i + "]", out));
    } else if (isObject(value) && Object.keys(value).length) {
      Object.keys(value).forEach(key => flattenData(value[key], path + "." + key, out));
    } else {
      out.push({ path, value: JSON.stringify(value) });
    }
    return out;
  }

  function buildModel(d, now) {
    const fresh = freshness(d, now);
    const updated = Date.parse(d.updatedAt);
    const subscriptions = d.subscriptions.map(s => {
      const days = daysUntil(s.renews, now, d);
      return {
        ...s, days, vnd: converted(s.price.currency, s.price.amount, d),
        date: dateLabel(s.renews, now, d),
        countdown: countdown(days, d),
        status: days < 0 ? "Recorded date passed — unconfirmed" :
          s.autoRenew ? "Auto-renewal enabled" : "Auto-renewal off",
        urgent: days <= d.rules.renewalAlertDays
      };
    }).sort((a, b) => a.renews.localeCompare(b.renews) || a.id.localeCompare(b.id));

    const futureCharges = subscriptions.filter(s => s.autoRenew && s.days >= 0);
    const nextCharges = futureCharges.length
      ? futureCharges.filter(s => s.renews === futureCharges[0].renews) : [];
    const monthlyVnd = sum(subscriptions, s => s.vnd);
    const monthlyUsd = sum(subscriptions.filter(s => s.price.currency === "USD"), s => s.price.amount);
    const monthlyNativeVnd = sum(subscriptions.filter(s => s.price.currency === "VND"), s => s.price.amount);

    const credits = d.credits.map(c => {
      const cls = d.creditClasses[c.class];
      const days = daysUntil(c.expires, now, d);
      const expired = days < 0;
      const live = cls.counted && !expired && c.left > 0;
      const pace = recentPace(c, d.rules);
      const budgetDays = Math.max(1, days);
      const old = Date.parse(c.checkedAt) < updated;
      const ahead = Date.parse(c.checkedAt) > now;
      const clockProblem = fresh.future || ahead;
      const needed = live && !clockProblem ? c.left / budgetDays : null;
      const loss = needed !== null && pace.rate !== null
        ? Math.max(0, c.left - pace.rate * budgetDays) : null;
      const soon = live && days <= d.rules.creditRiskDays;
      const onPace = loss === 0 && live && pace.rate !== null;
      let tone = "";
      if (cls.counted && c.left > 0) {
        if (expired) tone = "danger";
        else if (soon && !onPace && !clockProblem) {
          tone = days <= d.rules.creditUrgentDays ? "danger" :
            days <= d.rules.creditWarnDays ? "warning" : "";
        }
      }
      const finishMs = live && !clockProblem && pace.rate > 0
        ? now + c.left / pace.rate * DAY : null;
      const estimatedFinish = finishMs !== null &&
        Number.isFinite(finishMs) && Number.isFinite(new Date(finishMs).getTime())
        ? localYmd(finishMs, d) : null;
      return {
        ...c, days, expired, live, soon, onPace, tone, old, ahead, clockProblem,
        counted: cls.counted, classTitle: cls.title,
        date: dateLabel(c.expires, now, d),
        countdown: countdown(days, d),
        pace, needed, loss, budgetDays,
        vnd: converted(c.currency, c.left, d),
        lossVnd: loss === null ? null : converted(c.currency, loss, d),
        estimatedFinish
      };
    }).sort((a, b) =>
      Number(b.counted) - Number(a.counted) ||
      Number(b.soon) - Number(a.soon) ||
      a.expires.localeCompare(b.expires) || a.id.localeCompare(b.id)
    );

    const soon = credits.filter(c => c.soon);
    const risks = soon.filter(c => c.loss === null || c.loss > 0)
      .sort((a, b) => a.days - b.days || (b.lossVnd || 0) - (a.lossVnd || 0));
    const knownRisks = soon.filter(c => c.loss !== null && c.loss > 0);
    const unknownRisk = soon.filter(c => c.loss === null);
    const riskVnd = sum(knownRisks, c => c.lossVnd);
    const riskCurrency = knownRisks.length &&
      knownRisks.every(c => c.currency === knownRisks[0].currency)
      ? knownRisks[0].currency : "VND";
    const riskAmount = sum(knownRisks, c =>
      riskCurrency === c.currency ? c.loss : c.lossVnd);
    const usableVnd = sum(credits.filter(c => c.live), c => c.vnd);

    const usage = d.usageLimits.map(u => ({
      ...u,
      resetMs: Date.parse(u.resetsAt),
      resetPassed: now >= Date.parse(u.resetsAt),
      near: u.usedPct >= NEAR_LIMIT_PCT,
      remainingPct: Math.max(0, 100 - u.usedPct),
      old: Date.parse(u.checkedAt) < updated,
      ahead: Date.parse(u.checkedAt) > now,
      topUpTotal: sum(u.topUps, t => t.usd)
    }));

    const readings = d.credits.concat(d.usageLimits).map(item => ({
      id: item.id, name: item.name, checkedAt: item.checkedAt,
      old: Date.parse(item.checkedAt) < updated,
      ahead: Date.parse(item.checkedAt) > now
    }));
    const olderReadings = readings.filter(r => r.old).length;

    const deadlines = d.deadlines.map(item => {
      const days = daysUntil(item.date, now, d);
      return {
        ...item, days, displayDate: dateLabel(item.date, now, d),
        countdown: countdown(days, d),
        urgent: days <= d.rules.renewalAlertDays
      };
    }).sort((a, b) => a.date.localeCompare(b.date));

    const attention = [];
    subscriptions.filter(s => s.days < 0).forEach(s => attention.push({
      title: s.autoRenew ? "Confirm " + s.name + " renewal" : "Review " + s.name,
      copy: "Recorded date " + s.date + " passed. No new charge is assumed.",
      href: "#plan-" + s.id
    }));
    subscriptions.filter(s =>
      s.autoRenew && s.days >= 0 && s.days <= d.rules.renewalAlertDays &&
      !nextCharges.some(n => n.id === s.id)
    ).forEach(s => attention.push({
      title: s.name + " · " + money(s.price.currency, s.price.amount),
      copy: "Renews " + s.date + " · " + s.countdown,
      href: "#plan-" + s.id
    }));
    credits.filter(c => c.counted && c.expired && c.left > 0).forEach(c => attention.push({
      title: "Recheck " + c.name,
      copy: "Expiry " + c.date + " passed. Its recorded balance is excluded.",
      href: "#credit-" + c.id
    }));
    deadlines.filter(item => item.urgent).forEach(item => attention.push({
      title: item.name,
      copy: (item.days < 0 ? "Deadline passed " : "Expires ") + item.displayDate +
        (item.days >= 0 ? " · " + item.countdown : ""),
      href: "#deadline-" + item.id
    }));

    const sources = [
      ...subscriptions.map(s => ({ name: s.name, text: s.source })),
      ...credits.map(c => ({
        name: c.name,
        text: c.source + " · checked " + stampLabel(Date.parse(c.checkedAt), d)
      })),
      ...usage.map(u => ({
        name: u.name,
        text: u.source + " · checked " + stampLabel(Date.parse(u.checkedAt), d)
      })),
      ...usage.flatMap(u => u.topUps.map(t => ({
        name: u.name + " · " + money("USD", t.usd) + " top-up · " + t.ref,
        text: t.source
      }))),
      ...deadlines.map(item => ({ name: item.name, text: item.source })),
      { name: "USD / VND", text: "1 USD = " + vnd(d.fx.usdVnd) + " · " + d.fx.asOf },
      ...d.extraSources.map(value => ({ name: "Snapshot attribution", text: value }))
    ];

    return {
      data: d, now, fresh, subscriptions, nextCharges,
      monthlyVnd, monthlyUsd, monthlyNativeVnd,
      credits, soon, usableVnd, risks, knownRisks, riskVnd, riskCurrency, riskAmount,
      unknownRisk, usage, deadlines, attention, sources, readings, olderReadings,
      lowConfidence: soon.some(c => c.pace.lowConfidence),
      olderForecasts: soon.some(c => c.old),
      fields: flattenData(d)
    };
  }

  /* Pure view helpers. */
  /* Brand marks: official outlines; colours from official assets (see Calculations & assumptions). */
  let logoSeq = 0;
  const logoParts = key => {
    const def = LOGOS[key], uid = "lg" + (logoSeq++) + "-", defs = [], paths = [];
    def.p.forEach((p, i) => {
      let fill = p.f;
      if (p.g) { const id = uid + i; fill = "url(#" + id + ")"; defs.push(Object.assign({ id }, p.g)); }
      paths.push({ d: p.d, fill, evenodd: !!p.r });
    });
    return { vb: def.vb, defs, paths };
  };
  const logoSvg = key => {
    const m = logoParts(key);
    const g = m.defs.map(x => x.t === "r" ? `<radialGradient id="${x.id}" gradientUnits="userSpaceOnUse" cx="${x.cx}" cy="${x.cy}" r="${x.r}"><stop offset="0" stop-color="${x.c}"/><stop offset=".45" stop-color="${x.c}" stop-opacity=".9"/><stop offset="1" stop-color="${x.c}" stop-opacity="0"/></radialGradient>` : `<linearGradient id="${x.id}" gradientUnits="userSpaceOnUse" x1="${x.x1}" y1="${x.y1}" x2="${x.x2}" y2="${x.y2}"><stop offset="0" stop-color="${x.c}"/><stop offset="1" stop-color="${x.c2}"/></linearGradient>`).join("");
    return `<svg viewBox="${m.vb}" focusable="false">${g ? "<defs>" + g + "</defs>" : ""}${m.paths.map(p => `<path d="${p.d}" fill="${p.fill}"${p.evenodd ? ' fill-rule="evenodd"' : ""}/>`).join("")}</svg>`;
  };
  const logoView = key => html`<span class="mark" aria-hidden="true">${raw(logoSvg(key))}</span>`;
  const notesView = notes => notes.length
    ? html`<ul class="notes">${notes.map(note => html`<li>${note}</li>`)}</ul>` : "";
  const kv = pairs => html`<dl class="kv">${pairs.map(([label, value]) =>
    html`<div><dt>${label}</dt><dd>${value}</dd></div>`)}</dl>`;
  const openAttr = (ui, key) => ui.open.has(key) ? raw("open") : "";

  function fold(key, title, body, ui, hint = "", id = "") {
    return html`<details class="fold" data-key="${key}" ${id ? html`id="${id}"` : ""} ${openAttr(ui, key)}>
      <summary><span class="summary-label">${title}</span>
        ${hint ? html`<span class="reading-hint">${hint}</span>` : ""}
      </summary>
      <div class="fold-content">${body}</div>
    </details>`;
  }
  function refreshButton(ui) {
    return html`<button class="refresh-button" type="button" data-check
      aria-label="${ui.busy ? "Checking for an updated snapshot" : "Check for an updated snapshot"}"
      title="Check for an updated snapshot" aria-busy="${ui.busy}" ${ui.busy ? raw("disabled") : ""}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M20 7v5h-5M4 17v-5h5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6.1 6.2A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.8" stroke-linecap="round"/>
      </svg>
    </button>`;
  }
  function freshnessView(m) {
    const d = m.data, f = m.fresh;
    const nextDays = localOrdinal(f.next, d) - localOrdinal(m.now, d);
    const nextDate = nextDays === 0 ? "" : nextDays === 1 ? "tomorrow " :
      dateLabel(localYmd(f.next, d), m.now, d) + " ";
    return html`<div class="sync">
      <div class="sync-line">
        <span>Updated ${shortStamp(f.updated, m.now, d)}</span>
        <span class="sync-state ${f.tone}"><i class="dot" aria-hidden="true"></i>${f.title}</span>
      </div>
      <div class="sync-line">
        <span>${f.future ? "Snapshot is ahead of this clock" : relative(m.now - f.updated) + " ago"} · Next ${nextDate}${clockLabel(f.next, d, false)}</span>
        ${m.olderReadings ? html`<a class="reading-link" href="#reading-status" aria-label="View ${m.olderReadings} readings not re-checked in this snapshot"><span aria-hidden="true">·&nbsp;</span>${m.olderReadings} older reading${m.olderReadings === 1 ? "" : "s"}</a>` : ""}
      </div>
      ${f.stale ? html`<div class="sync-line warn">
        ${f.missed} missed · first ${shortStamp(f.expected, m.now, d)}
      </div>` : ""}
      ${f.due ? html`<div class="sync-line">Within the ${d.rules.staleGraceMinutes} min refresh grace period.</div>` : ""}
    </div>`;
  }
  function metricsView(m) {
    return html`<div class="metrics">
      <a class="metric" href="#plans">
        <span class="metric-label">Monthly plans ↓</span>
        <span class="metric-value">${m.monthlyUsd ? roundedVnd(m.monthlyVnd) : vnd(m.monthlyVnd)}</span>
        <span class="metric-hint">${m.subscriptions.length} listed · API spend separate</span>
      </a>
      <a class="metric" href="#credits">
        <span class="metric-label">Usable API credit ↓</span>
        <span class="metric-value">${roundedVnd(m.usableVnd)}</span>
        <span class="metric-hint">Recorded · excludes Cloud-only</span>
      </a>
    </div>`;
  }
  function paymentView(m) {
    const next = m.nextCharges, first = next[0];
    const same = first && next.every(s => s.price.currency === first.price.currency);
    const charge = !first ? "" : same
      ? money(first.price.currency, sum(next, s => s.price.amount))
      : roundedVnd(sum(next, s => s.vnd));
    return html`<section class="payment" aria-labelledby="next-heading">
      <div class="row between">
        <span class="payment-label">Next charge${next.length > 1 ? "s" : ""}</span>
        ${first && first.days <= m.data.rules.renewalAlertDays
          ? html`<b class="small">${first.countdown}</b>` : ""}
      </div>
      ${first ? html`<div class="payment-main">
        <h2 class="payment-name" id="next-heading">${next.map((s, i) => html`<span class="payment-entry">${i ? html`<span class="payment-sep" aria-hidden="true">+</span>` : ""}<span class="payment-plan">${logoView(s.logo)}<span>${s.name}</span></span></span>`)}</h2>
        <div class="payment-amount money">${charge}</div>
      </div>
      <div class="payment-meta">
        <span>${first.date} · ${first.countdown || "Auto-renewal"}</span>
        <span>${same && first.price.currency === "USD"
          ? roundedVnd(sum(next, s => s.vnd)) : m.data.card.name}</span>
      </div>` : html`<div class="payment-main">
        <h2 class="payment-name" id="next-heading">No future auto-charge recorded</h2>
      </div><p class="payment-meta">Passed dates are not advanced automatically.</p>`}
    </section>`;
  }
  function riskView(m) {
    let title, copy, tone = "", href = "#credits";
    if (m.fresh.future || m.soon.some(c => c.clockProblem)) {
      title = "Check the clock before using forecasts";
      copy = "A snapshot or balance reading is in the future.";
      tone = "warning";
    } else if (m.knownRisks.length) {
      const first = m.knownRisks[0];
      title = approximate(m.riskCurrency, m.riskAmount) + " may expire unused · est.";
      copy = first.name + ": need ≈ " + money(first.currency, first.needed) +
        "/day by " + first.date;
      if (m.knownRisks.length > 1) copy += " · " + (m.knownRisks.length - 1) + " more";
      if (m.unknownRisk.length) copy += " · " + m.unknownRisk.length + " unknown forecast(s)";
      if (m.lowConfidence) copy += " · low confidence";
      if (m.fresh.stale) copy += " · snapshot overdue";
      tone = m.knownRisks.some(c => c.tone === "danger") ? "danger" : "warning";
      href = "#credit-" + first.id;
    } else if (m.unknownRisk.length) {
      const first = m.unknownRisk[0];
      title = "Expiring credit needs more readings";
      copy = first.name + " · " + money(first.currency, first.left) +
        " expires " + first.date + ". No loss estimate.";
      tone = first.tone || "warning";
      href = "#credit-" + first.id;
    } else if (m.soon.length) {
      title = "Expiring credits on pace · estimate";
      const qualifiers = [];
      if (m.lowConfidence) qualifiers.push("Low confidence");
      if (m.olderForecasts) qualifiers.push("some readings are older");
      if (m.fresh.stale) qualifiers.push("snapshot overdue");
      copy = qualifiers.length
        ? qualifiers.join(" · ") + "."
        : "At the recorded spending pace; not a guarantee.";
    } else {
      title = "No usable credit expires soon";
      copy = "Nothing within " + m.data.rules.creditRiskDays + " days.";
    }
    return html`<a class="signal ${tone}" href="${href}">
      <div class="signal-title"><span>${title}</span><span class="signal-arrow" aria-hidden="true">↓</span></div>
      <p class="signal-copy">${copy}</p>
    </a>`;
  }
  function usageView(u, m, ui) {
    const d = m.data;
    return html`<article class="usage" id="usage-${u.id}">
      <div class="usage-head">
        ${logoView(u.logo)}
        <h3 class="usage-name grow">${u.name}</h3>
        <div class="usage-amount">${number(u.usedPct, 1)}% <span>${u.resetPassed ? "last used" : "used"}</span></div>
      </div>
      <div class="track ${u.resetPassed ? "passed" : u.near ? "warning" : ""}"
        role="progressbar" aria-label="${u.name}: recorded percentage used"
        aria-valuemin="0" aria-valuemax="100" aria-valuenow="${u.usedPct}"
        aria-valuetext="${number(u.usedPct, 1)}% used${u.resetPassed ? "; reset time passed, awaiting a new reading" : ""}">
        <i style="width:${u.usedPct}%"></i>
      </div>
      <div class="usage-meta">
        <span>${u.resetPassed ? "Reset time passed" : number(u.remainingPct, 1) + "% left at last check"}</span>
        <b class="${u.resetPassed || u.near ? "warn" : ""}">
          ${u.resetPassed ? "Awaiting new reading" :
            u.near ? "Near limit · reset in " + relative(u.resetMs - m.now) :
            "Reset in " + relative(u.resetMs - m.now)}
        </b>
      </div>
      ${fold("usage-details-" + u.id,
        "Details · " + money("USD", u.topUpTotal) + " in " + u.topUps.length + " top-ups",
        html`
          ${kv([
            ["Checked", stampLabel(Date.parse(u.checkedAt), d)],
            ["Reading", u.old ? "Not re-checked in this snapshot" : "Checked for this snapshot"],
            ["Reset", stampLabel(u.resetMs, d)],
            ["Used", number(u.usedPct, 1) + "%"],
            ["Remaining", number(u.remainingPct, 1) + "% at last check"],
            ["Top-ups", money("USD", u.topUpTotal) + " purchased · ≈ " + vnd(u.topUpTotal * d.fx.usdVnd)]
          ])}
          <p class="section-note">Top-ups are purchases, not a remaining extra-credit balance.
            ${u.resetPassed ? "The reset time has passed; usage is not assumed to be zero." : ""}</p>
          ${u.ahead ? html`<p class="warn">This reading is ahead of the device clock.</p>` : ""}
          ${u.topUps.map(t => html`<div class="source">
            <b>${money("USD", t.usd)} · ${dateLabel(t.date, m.now, d, true)}</b><br>
            ≈ ${vnd(t.usd * d.fx.usdVnd)}<br>
            Reference: <span class="mono">${t.ref}</span><br>
            Source: ${t.source}
          </div>`)}
          ${notesView(u.notes)}
          <p class="source">Source: ${u.source}</p>
        `, ui)}
    </article>`;
  }
  function attentionView(m, ui) {
    if (!m.attention.length) return "";
    const key = "attention";
    return html`<details class="notice" data-key="${key}" ${openAttr(ui, key)}>
      <summary>${m.attention.length} date${m.attention.length === 1 ? "" : "s"} need${m.attention.length === 1 ? "s" : ""} attention</summary>
      <ul>${m.attention.map(item => html`<li>
        <a href="${item.href}"><b>${item.title}</b></a><p>${item.copy}</p>
      </li>`)}</ul>
    </details>`;
  }
  function paceStrip(c) {
    if (c.needed === null) return "";
    return html`<div class="pace-strip" aria-label="Estimated daily spending comparison">
      <div><span>Needed / day</span><b>≈ ${money(c.currency, c.needed)}</b></div>
      <div><span>Recent / day</span><b>${c.pace.rate === null ? "Unknown" : "≈ " + money(c.currency, c.pace.rate)}</b></div>
    </div>`;
  }
  function forecastLine(c, m) {
    let label, tone = "";
    if (c.clockProblem) {
      label = "Forecast paused · check the clock";
      tone = "warn";
    } else if (c.loss === null) {
      label = "Pace unknown";
      tone = "muted";
    } else if (c.onPace) {
      label = "On pace · est.";
      tone = c.pace.lowConfidence || c.old || m.fresh.stale ? "" : "good";
    } else {
      label = approximate(c.currency, c.loss) + " unused at expiry · est.";

  /* Own-file updates: extract JSON without executing fetched code. */
  const START_MARKER = "/* DATA:" + "START */";
  const END_MARKER = "/* DATA:" + "END */";
  function extractSnapshot(source) {
    if (source.split(START_MARKER).length !== 2 || source.split(END_MARKER).length !== 2) {
      throw new Error("Snapshot markers are missing or duplicated.");
    }
    const start = source.indexOf(START_MARKER) + START_MARKER.length;
    const end = source.indexOf(END_MARKER);
    if (end <= start) throw new Error("Snapshot markers are out of order.");
    const value = JSON.parse(source.slice(start, end).trim());
    if (validateData(value).length) throw new Error("The incoming snapshot failed validation.");
    return value;
  }
  function canAcceptSnapshot(current, next) {
    if (validateData(next).length) return false;
    if (validateData(current).length) return true;
    if (Date.parse(next.updatedAt) < Date.parse(current.updatedAt)) return false;
    const incoming = new Map(
      next.credits.concat(next.usageLimits).map(item => [item.id, Date.parse(item.checkedAt)])
    );
    return current.credits.concat(current.usageLimits).every(item =>
      !incoming.has(item.id) || incoming.get(item.id) >= Date.parse(item.checkedAt)
    );
  }

    test("DATA and file contain no secret patterns", () => !secretLike(data) && !secretLike(source));
    test("marker uniqueness", () =>

    test("no external asset elements", () =>

    test("invalid-data view omits financial results", () => {

    test("same updatedAt newer manual reading accepted", () => {

    test("nonfinite derived totals rejected", () => mutateInvalid(d => {

    test("empty inventories render safely", () => {

      const m = buildModel(d, baseTime);
      return validateData(d).length === 0 && m.monthlyVnd === 0 && m.usableVnd === 0 &&
        markup(pageView(m, ui)).includes("No credit balances recorded");

    return results;
  }

  /* Browser controller. No local storage and no provider requests. */
  const app = document.getElementById("app");
  const FILE_SOURCE = document.documentElement.outerHTML;
  const FILE_URL = new URL("app.html", location.href).href;
  let currentData = window.DATA;
  let lastMarkup = "";
  let lastCheck = 0;
  let diagnosticHash = false;
  const ui = { open: new Set(), busy: false, network: "", networkError: false };

  function rememberDisclosures() {
    app.querySelectorAll("details[data-key]").forEach(detail => {
      if (detail.open) ui.open.add(detail.dataset.key);
      else ui.open.delete(detail.dataset.key);
    });
  }
  function focusIdentity() {
    const active = document.activeElement;
    if (!active || !app.contains(active)) return null;
    if (active.matches("summary")) return { type: "summary", key: active.parentElement.dataset.key };
    if (active.matches("[data-check]")) return { type: "check" };
    if (active.matches("a")) return { type: "link", key: active.getAttribute("href") };
    if (active.matches(".audit-scroll")) return { type: "audit" };
    return null;
  }
  function restoreFocus(identity) {
    if (!identity) return;
    let target;
    if (identity.type === "summary") {
      const detail = Array.from(app.querySelectorAll("details[data-key]"))
        .find(item => item.dataset.key === identity.key);
      target = detail && detail.querySelector("summary");
    } else if (identity.type === "check") target = app.querySelector("[data-check]");
    else if (identity.type === "audit") target = app.querySelector(".audit-scroll");
    else target = Array.from(app.querySelectorAll("a"))
      .find(a => a.getAttribute("href") === identity.key);
    if (target) target.focus({ preventScroll: true });
  }
  /* Patch only changed nodes (minute ticks change a few text nodes), so a
     tick never rebuilds the page while it is being scrolled. */
  function morphNode(cur, next) {
    if (cur.nodeType !== next.nodeType || cur.nodeName !== next.nodeName) { cur.replaceWith(next); return; }
    if (cur.nodeType === 3 || cur.nodeType === 8) { if (cur.nodeValue !== next.nodeValue) cur.nodeValue = next.nodeValue; return; }
    if (cur.isEqualNode(next)) return;
    const wasOpen = cur.nodeName === "DETAILS" ? cur.open : null;
    for (const a of Array.from(cur.attributes)) if (!next.hasAttribute(a.name) && a.name !== "open") cur.removeAttribute(a.name);
    for (const a of Array.from(next.attributes)) if (cur.getAttribute(a.name) !== a.value) cur.setAttribute(a.name, a.value);
    if (wasOpen !== null && !next.hasAttribute("open")) cur.open = wasOpen;
    morphList(cur, next);
  }
  function morphList(cur, next) {
    const a = Array.from(cur.childNodes), b = Array.from(next.childNodes);
    for (let i = 0; i < b.length; i++) {
      if (i < a.length) morphNode(a[i], b[i]); else cur.appendChild(b[i]);
    }
    for (let i = b.length; i < a.length; i++) a[i].remove();
  }
  function morphChildren(root, markupText) {
    const tpl = document.createElement("template");
    tpl.innerHTML = markupText;
    morphList(root, tpl.content);
  }
  function render() {
    if (location.hash === "#selftest") {
      if (!diagnosticHash) {
        app.className = "";
        const pre = document.createElement("pre");
        pre.className = "selftest";
        pre.textContent = runSelfTests(currentData, FILE_SOURCE).join("\n");
        app.replaceChildren(pre);
        diagnosticHash = true;
      }
      return;
    }
    if (diagnosticHash) {
      diagnosticHash = false;
      lastMarkup = "";
      app.className = "shell";
    }
    rememberDisclosures();
    const identity = focusIdentity();
    let nextMarkup;
    try {
      const errors = validateData(currentData);
      nextMarkup = markup(errors.length
        ? html`${errorView(errors)}${ui.network ? html`<p class="network error" role="status">${ui.network}</p>` : ""}`
        : pageView(buildModel(currentData, Date.now()), ui));
    } catch (_) {
      nextMarkup = markup(errorView(["This snapshot could not be calculated safely."]));
    }
    if (nextMarkup !== lastMarkup) {
      const audit = app.querySelector(".audit-scroll");
      const scroll = audit ? audit.scrollTop : 0;
      if (lastMarkup && app.firstChild) morphChildren(app, nextMarkup);
      else app.innerHTML = nextMarkup;
      lastMarkup = nextMarkup;
      const nextAudit = app.querySelector(".audit-scroll");
      if (nextAudit) nextAudit.scrollTop = scroll;
      restoreFocus(identity);
    }
  }
  async function checkForUpdate(manual) {
    if (location.hash === "#selftest" || ui.busy) return;
    if (location.protocol !== "http:" && location.protocol !== "https:") {
      if (manual) {
        ui.network = "Own-file checks require HTTP or HTTPS. For a local file, replace the snapshot and reload.";
        ui.networkError = false;
        render();
      }
      return;
    }
    if (!manual && Date.now() - lastCheck < 5 * MINUTE) return;
    lastCheck = Date.now();
    ui.busy = true;
    if (manual) { ui.network = ""; ui.networkError = false; }
    render();

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 20 * 1000);
    try {
      const response = await fetch(FILE_URL, {
        cache: "no-cache",
        credentials: "same-origin",
        redirect: "error",
        signal: controller.signal
      });
      if (!response.ok) throw new Error("The file was unavailable.");
      const next = extractSnapshot(await response.text());
      if (!canAcceptSnapshot(currentData, next)) {
        ui.network = "An older or regressing snapshot was ignored. The loaded snapshot is unchanged.";
        ui.networkError = true;
      } else {
        const changed = JSON.stringify(currentData) !== JSON.stringify(next);
        if (changed) {
          currentData = next;
          window.DATA = next;
        }
        if (manual || changed || ui.networkError) {
          ui.network = changed ? "Updated snapshot loaded." : "No newer snapshot is available.";
        }
        ui.networkError = false;
      }
    } catch (error) {
      ui.network = error && error.name === "AbortError"
        ? "The update check timed out. The loaded snapshot is unchanged."
        : "The update could not be read or validated. The loaded snapshot is unchanged.";
      ui.networkError = true;
    } finally {
      clearTimeout(timeout);
      ui.busy = false;
      render();
    }
  }
  function revealTarget(id) {
    const target = id && document.getElementById(id);
    if (!target) return;
    if (target.matches("details")) {
      target.open = true;
      if (target.dataset.key) ui.open.add(target.dataset.key);
    }
    let parent = target.parentElement;
    while (parent && parent !== app) {
      if (parent.matches("details")) {
        parent.open = true;
        if (parent.dataset.key) ui.open.add(parent.dataset.key);
      }
      parent = parent.parentElement;
    }
  }
  function revealHashTarget() {
    if (location.hash === "#selftest") return;
    try { revealTarget(decodeURIComponent(location.hash.slice(1))); } catch (_) {}
  }

  app.addEventListener("click", event => {
    if (event.target.closest("[data-check]")) {
      checkForUpdate(true);
      return;
    }
    const anchor = event.target.closest('a[href^="#"]');
    if (anchor) {
      try { revealTarget(decodeURIComponent(anchor.getAttribute("href").slice(1))); } catch (_) {}
    }
  });
  app.addEventListener("toggle", event => {
    const detail = event.target;
    if (!detail.matches || !detail.matches("details[data-key]") || !app.contains(detail)) return;
    if (detail.open) ui.open.add(detail.dataset.key);
    else ui.open.delete(detail.dataset.key);
  }, true);
  window.addEventListener("hashchange", () => {
    render();
    revealHashTarget();
  });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { render(); checkForUpdate(false); }
  });
  window.addEventListener("pageshow", () => {
    render();
    if (location.hash !== "#selftest") checkForUpdate(false);
  });
  setInterval(() => {
    if (!document.hidden && location.hash !== "#selftest") {
      render();
      checkForUpdate(false);
    }
  }, MINUTE);

  window.AISubscription = Object.freeze({
    validateData, buildModel, recentPace, freshness, nextSlot,
    daysUntil, flattenData, canAcceptSnapshot
  });

  render();
  revealHashTarget();
})();
